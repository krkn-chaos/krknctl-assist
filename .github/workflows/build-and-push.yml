name: Build and Push Docker Images

on:
  push:
    tags:
      - '*'

jobs:
  build-apple-silicon:
    name: Build Apple Silicon Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push Apple Silicon image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./krkn-assist/Dockerfile
          platforms: linux/arm64
          push: true
          tags: quay.io/krkn-chaos/krknctl-assist:apple-silicon
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-intel:
    name: Build Intel Multi-arch Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push Intel multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./krkn-assist/Dockerfile.linux
          platforms: linux/amd64,linux/arm64
          push: true
          tags: quay.io/krkn-chaos/krknctl-assist:intel
          cache-from: type=gha
          cache-to: type=gha,mode=max
