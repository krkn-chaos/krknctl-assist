name: Build and Push Docker Images

# Builds and pushes multi-arch Docker images to Quay.io on every tag push.
#
# Performance optimization:
# - ARM64 builds use QEMU emulation (~1.5h compile time for llama-cpp-python)
# - To speed up: pre-compile ARM64 wheel locally and upload to GitHub Releases
# - See WHEELS_QUICKSTART.md for details
#
# Requirements for pre-compiled wheels:
# - Apple Silicon Mac (M1/M2/M3/M4) OR ARM64 Linux machine
# - Run: ./scripts/build_wheel_local.sh <version>
# - Run: ./scripts/upload_wheel.sh <version>

on:
  push:
    tags:
      - '*'

jobs:
  prebuild-index:
    name: Pre-build FAISS Index (x86_64 native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd krkn-assist
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch torchvision torchaudio
          pip install \
            transformers \
            huggingface_hub \
            faiss-cpu \
            onnx \
            onnxruntime \
            onnxscript \
            optimum[onnxruntime] \
            sentence-transformers \
            requests

      - name: Generate FAISS index and export ONNX reranker
        run: |
          cd krkn-assist
          python3 prebuild_index.py

      - name: Export ONNX reranker model
        run: |
          cd krkn-assist
          export HF_HOME=.cache/huggingface
          python3 -c "
          from assist.ranking import OnnxCrossEncoder
          from assist.settings import CROSS_ENCODER_MODEL
          import os
          print(f'Exporting ONNX reranker: {CROSS_ENCODER_MODEL}')
          print(f'HF_HOME: {os.environ.get(\"HF_HOME\")}')
          cross_encoder = OnnxCrossEncoder(CROSS_ENCODER_MODEL)
          onnx_dir = cross_encoder._onnx_model_dir()
          print(f'ONNX cache directory: {onnx_dir}')
          print(f'Directory exists: {onnx_dir.exists()}')
          if onnx_dir.exists():
              import os
              for root, dirs, files in os.walk(onnx_dir):
                  for file in files:
                      print(f'  {os.path.join(root, file)}')
          print('ONNX reranker exported successfully')
          "

      - name: Upload FAISS index artifact
        uses: actions/upload-artifact@v4
        with:
          name: faiss-index
          path: krkn-assist/faiss-index/
          retention-days: 1

      - name: Upload ONNX cache artifact (if exists)
        uses: actions/upload-artifact@v4
        if: hashFiles('krkn-assist/.cache/huggingface/onnx_rerankers/**') != ''
        with:
          name: onnx-cache
          path: krkn-assist/.cache/huggingface/onnx_rerankers/
          retention-days: 1

  build-apple-silicon:
    needs: prebuild-index
    name: Build Apple Silicon Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download pre-built index
        uses: actions/download-artifact@v4
        with:
          name: faiss-index
          path: krkn-assist/faiss-index/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push Apple Silicon image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./krkn-assist/Dockerfile.apple-silicon
          platforms: linux/arm64
          push: true
          tags: quay.io/krkn-chaos/krknctl-assist:apple-silicon
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  build-intel:
    needs: prebuild-index
    name: Build Intel Multi-arch Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download pre-built FAISS index
        uses: actions/download-artifact@v4
        with:
          name: faiss-index
          path: krkn-assist/faiss-index/

      - name: Download pre-built ONNX cache (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: onnx-cache
          path: krkn-assist/.cache/huggingface/onnx_rerankers/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push Intel multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./krkn-assist/Dockerfile.linux
          platforms: linux/amd64,linux/arm64
          push: true
          tags: quay.io/krkn-chaos/krknctl-assist:intel
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
