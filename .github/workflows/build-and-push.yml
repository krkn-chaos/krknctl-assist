name: Build and Push Docker Images

# Builds and pushes Docker images to Quay.io on every tag push.
#
# Three image variants:
# - apple-silicon (ARM64): Vulkan backend for macOS Apple Silicon
# - nvidia-consumer (AMD64 + ARM64): CUDA backend for RTX/GTX consumer GPUs
# - nvidia-datacenter (AMD64 + ARM64): CUDA backend for V100/A100/H100 datacenter GPUs
#
# Performance optimization:
# - Pre-compiled llama-cpp-python wheels from GitHub Releases
# - Pre-built FAISS index and ONNX reranker models
# - Native builds (no QEMU cross-compilation)

on:
  push:
    tags:
      - '*'

jobs:
  prebuild-models:
    name: Pre-build FAISS Index & ONNX Reranker (x86_64 native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd krkn-assist
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch torchvision torchaudio
          pip install \
            transformers \
            huggingface_hub \
            faiss-cpu \
            onnx \
            onnxruntime \
            onnxscript \
            optimum[onnxruntime] \
            sentence-transformers \
            requests

      - name: Generate FAISS index and export ONNX reranker
        run: |
          cd krkn-assist
          python3 prebuild_index.py

      - name: Export ONNX reranker model
        run: |
          cd krkn-assist
          export HF_HOME=$PWD/.cache/huggingface
          python3 << 'PYTHON_SCRIPT'
          from assist.ranking import OnnxCrossEncoder
          from assist.settings import CROSS_ENCODER_MODEL
          import os

          print(f'Exporting ONNX reranker: {CROSS_ENCODER_MODEL}')
          print(f'HF_HOME: {os.environ.get("HF_HOME")}')

          cross_encoder = OnnxCrossEncoder(CROSS_ENCODER_MODEL)
          onnx_dir = cross_encoder._onnx_model_dir()

          print(f'ONNX cache directory: {onnx_dir}')
          print(f'Directory exists: {onnx_dir.exists()}')

          if onnx_dir.exists():
              for root, dirs, files in os.walk(onnx_dir):
                  for file in files:
                      filepath = os.path.join(root, file)
                      size_mb = os.path.getsize(filepath) / (1024 * 1024)
                      print(f'  {filepath} ({size_mb:.2f} MB)')

          print('ONNX reranker exported successfully')
          PYTHON_SCRIPT

      - name: Upload FAISS index artifact
        uses: actions/upload-artifact@v4
        with:
          name: faiss-index
          path: krkn-assist/faiss-index/
          retention-days: 1

      - name: Upload ONNX cache artifact (if exists)
        uses: actions/upload-artifact@v4
        if: hashFiles('krkn-assist/.cache/huggingface/onnx_rerankers/**') != ''
        with:
          name: onnx-cache
          path: krkn-assist/.cache/huggingface/onnx_rerankers/
          retention-days: 1

  build-apple-silicon:
    needs: prebuild-models
    name: Build Apple Silicon Image (ARM64 Vulkan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download pre-built FAISS index
        uses: actions/download-artifact@v4
        with:
          name: faiss-index
          path: krkn-assist/faiss-index/

      - name: Download pre-built ONNX cache (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: onnx-cache
          path: krkn-assist/.cache/huggingface/onnx_rerankers/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push Apple Silicon image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./krkn-assist/Dockerfile.apple-silicon
          platforms: linux/arm64
          push: true
          tags: quay.io/krkn-chaos/krknctl-assist:apple-silicon
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  build-nvidia-consumer:
    needs: prebuild-models
    name: Build NVIDIA Consumer Image (AMD64 + ARM64 CUDA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download pre-built FAISS index
        uses: actions/download-artifact@v4
        with:
          name: faiss-index
          path: krkn-assist/faiss-index/

      - name: Download pre-built ONNX cache (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: onnx-cache
          path: krkn-assist/.cache/huggingface/onnx_rerankers/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push NVIDIA Consumer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./krkn-assist/Dockerfile.nvidia-consumer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: quay.io/krkn-chaos/krknctl-assist:nvidia-consumer
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  build-nvidia-datacenter:
    needs: prebuild-models
    name: Build NVIDIA Datacenter Image (AMD64 + ARM64 CUDA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download pre-built FAISS index
        uses: actions/download-artifact@v4
        with:
          name: faiss-index
          path: krkn-assist/faiss-index/

      - name: Download pre-built ONNX cache (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: onnx-cache
          path: krkn-assist/.cache/huggingface/onnx_rerankers/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push NVIDIA Datacenter image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./krkn-assist/Dockerfile.nvidia-datacenter
          platforms: linux/amd64,linux/arm64
          push: true
          tags: quay.io/krkn-chaos/krknctl-assist:nvidia-datacenter
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
